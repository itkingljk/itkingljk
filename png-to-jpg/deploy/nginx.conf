# Replace SERVER_PUBLIC_IP and convert.example.com before installation.
# Install to /etc/nginx/sites-available/qingzhuan on Ubuntu/Debian.
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_PUBLIC_IP convert.example.com;
    root /var/www/qingzhuan;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD { deny all; }
    }
    location ~ /\. { deny all; }
}
